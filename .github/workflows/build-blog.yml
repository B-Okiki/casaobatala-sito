name: Build Blog

# Quando si attiva
on:
  push:
    branches:
      - main
    paths:
      - 'blog/*.md'
      - 'templates/*.html'
      - '.github/workflows/build-blog.yml'
      - 'scripts/build_blog.py'
      - 'scripts/generate_rss.py'
  
  # Permette di lanciarlo manualmente
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      # 1. Scarica il repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # 2. Installa Python con cache pip
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # 3. Installa dipendenze
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install Pillow
      
      # 4. Esegui lo script di build
      - name: Build blog articles
        run: |
          python scripts/build_blog.py

      # 5. Genera il feed RSS
      - name: Generate RSS feed
        run: |
          python scripts/generate_rss.py

      # 6. Ottimizza immagini del blog
      - name: Optimize blog images
        run: |
          python scripts/optimize_images.py

      # 7. Controlla link rotti
      - name: Check broken links
        run: |
          python scripts/check_links.py
        # Non blocca la build — solo avviso nei log
        # Per bloccarla: python scripts/check_links.py --strict

      # 8. Committa e pusha le modifiche
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "🤖 Auto-build: blog + RSS + image optimization"
          git pull --rebase origin main
          git push
          
      # 9. Svuota cache Cloudflare
      - name: Attendi deploy GitHub Pages
        run: sleep 30

      - name: Svuota Cache Cloudflare
        uses: jakejarvis/cloudflare-purge-action@master
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}

      # 10. Ping IndexNow a Bing (e altri motori partecipanti)
      - name: Ping IndexNow
        if: success()
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python scripts/ping_indexnow.py --changed-only --days 7
